<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人脸识别验证 (纯本地模型版)</title>
    <!-- 引入 Supabase (这个必须连外网，如果是 Supabase 被墙请挂梯子或换国内 BaaS) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 引入你本地的 face-api.js -->
    <script defer src="./face-api.js-master/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Microsoft YaHei'; text-align: center; background: #f4f7f6; padding-top: 30px;}
        .box { background: white; padding: 30px; border-radius: 10px; width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        video { width: 100%; border-radius: 10px; background: #000; margin-top: 15px; display: none;}
        input { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 5px; font-size: 16px;}
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; color: white; background: #2ecc71; cursor: pointer; margin-left: 10px;}
        #status { font-size: 20px; font-weight: bold; margin: 15px 0; color: #555; }
    </style>
</head>
<body>
<div class="box">
    <h2>人脸验证系统</h2>
    <input type="text" id="verify-name" placeholder="输入姓名">
    <button onclick="verifyFace()">验证</button>
    <div id="status">正在加载本地模型...</div>
    <video id="video" autoplay muted playsinline></video>
</div>

<script>
    const supabaseUrl = 'https://ibttldcweltxgogrmrlp.supabase.co'; 
    const supabaseKey = 'sb_publishable_Kqbd5cTYBdKC6qErlj797w_YbCFjBiA'; 
    let client;

    window.onload = async () => {
        if(typeof supabase === 'undefined') {
            document.getElementById('status').innerText = "Supabase 加载失败，可能需要科学上网或换 CDN";
            return;
        }
        client = supabase.createClient(supabaseUrl, supabaseKey);

        try {
            document.getElementById('status').innerText = "正在加载本地模型...";
            // 用你本地文件夹里的模型，不走外网！
            await faceapi.nets.tinyFaceDetector.loadFromUri('./face-api.js-master/weights');
            await faceapi.nets.faceLandmark68Net.loadFromUri('./face-api.js-master/weights');
            await faceapi.nets.faceRecognitionNet.loadFromUri('./face-api.js-master/weights');
            
            document.getElementById('status').innerText = "模型就绪，请输入姓名";
            document.getElementById('status').style.color = "#2ecc71";
        } catch (e) {
            document.getElementById('status').innerText = "本地模型加载失败，请检查路径：./face-api.js-master/weights";
            console.error(e);
        }
    }

    async function verifyFace() {
        const name = document.getElementById('verify-name').value;
        if(!name) return alert("请输入姓名");
        const status = document.getElementById('status');
        status.innerText = "正在查库...";
        
        try {
            const { data, error } = await client.from('users_face').select('*').eq('name', name);
            if(error) throw new Error("数据库连接失败: " + error.message);
            if(data.length === 0) { status.innerText = "未找到此人"; return; }
            
            status.innerText = "开启摄像头...";
            const video = document.getElementById('video');
            video.style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            await new Promise(r => setTimeout(r, 1500));
            
            status.innerText = "比对中...";
            const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if(!det) { 
                status.innerText = "未检测到人脸"; 
                stream.getTracks().forEach(t=>t.stop()); 
                video.style.display='none';
                return; 
            }
            
            let match = false;
            for(let user of data) {
                // 注意：如果这里 ERR_CONNECTION_RESET，说明 Supabase 的图片存储被墙了
                const img = await faceapi.fetchImage(user.image_url);
                const ref = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                if(ref && faceapi.euclideanDistance(det.descriptor, ref.descriptor) < 0.55) {
                    match = true; break;
                }
            }
            
            status.innerText = match ? "✅ 验证通过！" : "❌ 验证失败！";
            status.style.color = match ? "#2ecc71" : "#e74c3c";
            stream.getTracks().forEach(t=>t.stop());
            video.style.display = 'none';
        } catch(e) {
            status.innerText = "报错: " + e.message;
        }
    }
</script>
</body>
</html>
