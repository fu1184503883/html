<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 5px; cursor: pointer; background-color: #2ecc71; color: white; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .links { margin-top: 15px; font-size: 14px; }
        .links a { color: #3498db; text-decoration: none; }
        #status { margin-top: 15px; font-size: 14px; color: #e74c3c; }
    </style>
</head>
<body>

<div class="box">
    <h2>欢迎登录</h2>
    <input type="email" id="email" placeholder="请输入邮箱" required>
    <input type="password" id="password" placeholder="请输入密码" required>
    <button onclick="login()">登 录</button>
    
    <div class="links">
        还没有账号？ <a href="register.html">立即注册</a>
    </div>
    <div id="status"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabaseUrl = 'https://ibttldcweltxgogrmrlp.supabase.co'; 
    const supabaseKey = 'sb_publishable_Kqbd5cTYBdKC6qErlj797w_YbCFjBiA'; 
    const supabase = createClient(supabaseUrl, supabaseKey);

    // 检查是否已经登录，如果已登录直接进主页
    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) { window.location.href = 'home.html'; }
    });

    window.login = async function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');

        if(!email || !password) {
            status.innerText = "请输入邮箱和密码！";
            return;
        }
        status.style.color = "#555";
        status.innerText = "正在登录...";

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            status.style.color = "#e74c3c";
            status.innerText = "登录失败: " + (error.message === 'Invalid login credentials' ? '账号或密码错误' : error.message);
        } else {
            status.style.color = "#2ecc71";
            status.innerText = "登录成功，正在跳转...";
            setTimeout(() => { window.location.href = 'home.html'; }, 800);
        }
    }
</script>

</body>
</html>
